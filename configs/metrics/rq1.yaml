enabled:
  - cka
  - pwcca
  - knn_overlap

pairs_mode: explicit
modalities:
  - rgb
  - depth
  - normals

pairs:
  - [rgb, depth]
  - [rgb, normals]
  - [depth, normals]

cka:
  center_gram: true
  unbiased: false

pwcca:
  eps: 1.0e-10
  pca:
    enabled: true
    n_components: 64
    seed: 0
    shared_basis: false

knn_overlap:
  k: 10
  pca:
    enabled: true
    n_components: 64
    seed: 0
    shared_basis: false

output:
  save_csv: true
  save_parquet: false
