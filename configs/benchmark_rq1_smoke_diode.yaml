# RQ1 smoke preset (DIODE, small footprint to validate full wiring).
#
# Same modality pairs and metrics as the final DIODE preset, but with much
# fewer samples, scenes and null draws so the entire pipeline finishes
# quickly. Useful to test the DIODE wiring before launching the full run.
#
# Run with:
#   python -m src.run_benchmark --config-name benchmark_rq1_smoke_diode

defaults:
  - default
  - override data: diode
  - override runtime: full_gpu_faiss
  - override tracking: wandb_on
  - _self_

project:
  stage: rq1_smoke_diode

data:
  name: diode
  split: train+val
  environment: [indoors, outdoor]
  n_scenes: 5
  scene_stride: 1
  frames_per_scene: null
  max_total_samples: 200
  seed: 42

analysis:
  null_distribution:
    enabled: true
    metrics_enabled: [cka, pwcca, knn_overlap]
    draws_per_batch: 50
    min_total_draws: 100
    max_total_draws: 300
    reuse_if_exists: false
    resume_if_partial: false
    adaptive_stop:
      enabled: true
      alpha: 0.05
      correction: bh_fdr
      require_all_hypotheses: true
