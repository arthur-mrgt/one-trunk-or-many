defaults:
  - _self_
  - data: hypersim
  - model: fourm
  - metrics: rq1
  - tracking: wandb_on
  - runtime: local
  - slurm: izar

project:
  name: one-trunk-or-many
  stage: default
  seed: 42

paths:
  resources_root: ./resources
  datasets_root: ${paths.resources_root}/datasets
  models_root: ${paths.resources_root}/models/4m
  results_root: ./results
  runs_root: ${paths.results_root}/runs
  # Optional override for activation .npy storage. When set (e.g. /tmp/$USER on
  # SLURM compute nodes), activation files are written to
  # `<activations_root>/<run_id>/activations/...` instead of the in-run-dir
  # default. Useful to bypass slow shared filesystems (Lustre) on clusters.
  # All other artifacts (metrics, null distributions, configs) stay in
  # `runs_root` so results are persistent. The activation_index CSV records
  # absolute paths so downstream stages find files regardless of the choice.
  activations_root: null

analysis:
  null_distribution:
    enabled: true
    metrics_enabled: [cka, pwcca, knn_overlap]
    artifact_filename: null_distribution.csv
    state_filename: null_distribution_state.json
    sampling_mode: cross_scene_type_random
    # `metadata_path` and `scene_type_source` are dataset-specific and live in
    # each `configs/data/<name>.yaml`. See those files for the supported values.
    seed: 42
    replace: true
    min_scenes: 2
    sample_size_mode: observed_n_samples
    sample_size_value: null
    draws_per_batch: 200
    min_total_draws: 200
    max_total_draws: 5000
    max_batches: 0
    checkpoint_every_batches: 1
    checkpoint_every_hypotheses: 1
    progress_log_every_batches: 1
    draw_chunk_size: 50
    on_keyboard_interrupt: save_and_continue
    reuse_if_exists: false
    resume_if_partial: false
    n_draws: 1000
    artifact_dir: ${paths.runs_root}/null_distributions
    adaptive_stop:
      enabled: true
      alpha: 0.05
      correction: bh_fdr
      require_all_hypotheses: true

hydra:
  run:
    dir: ${paths.runs_root}/hydra/${now_utc:%Y-%m-%d}/${now_utc:%H-%M-%S}
