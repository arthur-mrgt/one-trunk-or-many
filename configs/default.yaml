defaults:
  - data: hypersim
  - model: fourm
  - metrics: cka
  - tracking: wandb_off
  - runtime: local
  - slurm: izar
  - _self_

project:
  name: one-trunk-or-many
  stage: rq1_cka_pipeline
  seed: 42

paths:
  resources_root: ./resources
  datasets_root: ${paths.resources_root}/datasets
  models_root: ${paths.resources_root}/models/4m
  results_root: ./results
  runs_root: ${paths.results_root}/runs

analysis:
  null_distribution:
    enabled: false
    n_draws: 1000
    sampling: cross_scene_type_random
    metadata_path: ${paths.datasets_root}/hypersim/metadata_camera_trajectories.csv
    seed: 42
    replace: true
    artifact_dir: ${paths.runs_root}/null_distributions
    reuse_if_exists: true
    min_scenes: 2

hydra:
  run:
    dir: ${paths.runs_root}/hydra/${now_utc:%Y-%m-%d}/${now_utc:%H-%M-%S}
