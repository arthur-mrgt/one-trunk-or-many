# RQ1 final run preset (Hypersim, 100 scenes, ~4000 random paired samples).
#
# Launches the full pipeline end-to-end with:
#   - 3 modality pairs: rgb-depth, rgb-normals, depth-normals (from metrics=rq1)
#   - 3 metrics: CKA, PWCCA, kNN_overlap with GPU + FAISS backends
#   - adaptive null distribution with min_total_draws=1000 (low p-value floor)
#
# Run with:
#   python -m src.run_benchmark --config-name benchmark_rq1_final_hypersim

defaults:
  - default
  - override runtime: full_gpu_faiss
  - override tracking: wandb_on
  - _self_

project:
  stage: rq1_final_hypersim

data:
  name: hypersim
  n_scenes: 100
  scene_stride: 1
  frames_per_scene: null
  max_total_samples: 4000
  seed: 42

analysis:
  null_distribution:
    enabled: true
    metrics_enabled: [cka, pwcca, knn_overlap]
    draws_per_batch: 200
    min_total_draws: 1000
    max_total_draws: 5000
    reuse_if_exists: false
    resume_if_partial: false
    adaptive_stop:
      enabled: true
      alpha: 0.01
      correction: bh_fdr
      require_all_hypotheses: true
