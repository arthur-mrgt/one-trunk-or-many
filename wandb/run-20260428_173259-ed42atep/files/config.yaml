analysis:
    value:
        null_distribution:
            enabled: false
            n_mismatched_pairs: 1000
            note: Scaffold only in this iteration.
            sampling: random_scene
data:
    value:
        modalities:
            - rgb
            - depth
        n_scenes: 1
        name: hypersim
        root: ./resources/datasets/hypersim
        scene_stride: 1
        split: train
metrics:
    value:
        cka:
            center_gram: true
            unbiased: false
        enabled:
            - cka
        output:
            save_csv: true
            save_parquet: false
        pairs:
            - - rgb
              - depth
model:
